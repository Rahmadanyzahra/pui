# Pengujian otomatis TARA. Berjalan pada setiap push ke main dan setiap pull request.
#
#   backend       : ESLint, Jest (unit + repository + integrasi ke MySQL uji) dengan laporan cakupan,
#                   lalu uji black-box API memakai Newman terhadap server uji.
#   flutter       : flutter analyze, uji unit/widget, dan membangun APK.
#   uji-ui-android: alur utama (integration_test) di emulator Android. Manual, karena lama.
#   uji-beban     : k6 dengan 50 pasangan akun. Manual.
#
# Semua job memakai server UJI dan database UJI yang dibuat di dalam runner (lihat backend/node_backend/.env.test).
# Tidak ada job yang menyentuh server atau data peserta, dan tidak ada rahasia yang dibutuhkan.
#
# Catatan: folder backend/node_backend harus ikut tersimpan di repo ini. Selama folder itu masih berupa
# repo git tersendiri (tanpa isi di GitHub), job backend hanya memberi peringatan dan dilewati.
name: CI TARA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      uji_ui:
        description: Jalankan uji alur utama di emulator Android
        type: boolean
        default: false
      uji_beban:
        description: Jalankan uji beban k6
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  FLUTTER_VERSION: '3.38.4'

jobs:
  backend:
    name: Backend (lint, Jest, Newman)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend/node_backend
    steps:
      - uses: actions/checkout@v4

      - name: Periksa kode backend
        id: kode
        working-directory: .
        run: |
          if [ -f backend/node_backend/package.json ]; then
            echo "ada=true" >> "$GITHUB_OUTPUT"
          else
            echo "ada=false" >> "$GITHUB_OUTPUT"
            echo "::warning::backend/node_backend tidak ada di repo ini, jadi uji backend DILEWATI. Simpan folder itu sebagai folder biasa (bukan repo git di dalam repo)."
          fi

      - uses: actions/setup-node@v4
        if: steps.kode.outputs.ada == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/node_backend/package-lock.json

      - name: Pasang dependensi
        if: steps.kode.outputs.ada == 'true'
        run: npm ci

      - name: ESLint
        if: steps.kode.outputs.ada == 'true'
        run: npm run lint

      - name: Jest dengan cakupan kode
        if: steps.kode.outputs.ada == 'true'
        run: npm run test:coverage

      - name: Ringkasan cakupan per lapisan
        if: steps.kode.outputs.ada == 'true'
        run: node scripts/ringkas_cakupan.js | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Jalankan server uji
        if: steps.kode.outputs.ada == 'true'
        run: |
          nohup npm run test:server > server_tes.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5055/health > /dev/null; then echo "Server uji siap."; exit 0; fi
            sleep 2
          done
          echo "Server uji tidak menyala:"; cat server_tes.log; exit 1

      - name: Black-box API (Newman)
        if: steps.kode.outputs.ada == 'true'
        run: npm run test:api

      - name: Simpan laporan
        if: always() && steps.kode.outputs.ada == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: laporan-backend
          if-no-files-found: ignore
          path: |
            backend/node_backend/coverage/lcov-report
            backend/node_backend/coverage/coverage-summary.json
            backend/node_backend/server_tes.log
            pengujian/api/hasil/newman.junit.xml

  flutter:
    name: Flutter (analyze, uji, APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analisis statis
        run: flutter analyze
      - name: Uji unit dan widget
        run: flutter test
      - name: Bangun APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: tara-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  uji-ui-android:
    name: Alur utama di emulator Android
    if: github.event_name == 'workflow_dispatch' && inputs.uji_ui
    needs: [backend, flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Jalankan server uji
        working-directory: backend/node_backend
        run: |
          npm ci
          nohup npm run test:server > server_tes.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5055/health > /dev/null && exit 0; sleep 2; done
          cat server_tes.log; exit 1
      - name: Izinkan akselerasi emulator (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
      # Dari dalam emulator, 10.0.2.2 adalah mesin runner, tempat server uji berjalan.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: >-
            adb shell pm grant com.example.patara_ai android.permission.POST_NOTIFICATIONS || true;
            flutter test integration_test/alur_utama_test.dart
            --dart-define=TARA_TEST_SERVER=http://10.0.2.2:5055

  uji-beban:
    name: Uji beban k6 (50 pasangan akun)
    if: github.event_name == 'workflow_dispatch' && inputs.uji_beban
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: grafana/setup-k6-action@v1
      - name: Jalankan server uji
        working-directory: backend/node_backend
        run: |
          npm ci
          nohup npm run test:server > server_tes.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5055/health > /dev/null && exit 0; sleep 2; done
          cat server_tes.log; exit 1
      - name: k6
        working-directory: pengujian/beban
        run: |
          mkdir -p hasil
          k6 run --summary-export hasil/ci.json uji_beban.k6.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hasil-uji-beban
          path: pengujian/beban/hasil/ci.json
